name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run coverage:check
      - run: bun scripts/package-smoke.ts

  authenticated-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run authenticated smoke against minimum and latest OpenCode
        shell: bash
        run: |
          minimum=$(node -p "require('./package.json').engines.opencode.match(/>=([0-9.]+)/)[1]")
          for target in "$minimum" latest; do
            bun add --global "opencode-ai@$target"
            opencode --version
            OPENCODE_SMOKE_MODEL="${OPENCODE_SMOKE_MODEL}" bun scripts/smoke-opencode.ts
          done
        env:
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
          OPENCODE_SMOKE_MODEL: ${{ vars.OPENCODE_SMOKE_MODEL || 'Ark/deepseek-v4-flash' }}
