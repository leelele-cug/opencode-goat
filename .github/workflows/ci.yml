name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Generate coverage report
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          bun test --coverage --coverage-reporter=text > coverage.txt 2>&1
          status=$?
          cat coverage.txt
          echo "coverage exit code: $status"
          echo "GOAT_COVERAGE_EXIT_CODE=$status" >> "$GITHUB_ENV"
      - name: Generate coverage report (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun test --coverage --coverage-reporter=text *> coverage.txt
          $status = $LASTEXITCODE
          Get-Content coverage.txt
          Write-Host "coverage exit code: $status"
          "GOAT_COVERAGE_EXIT_CODE=$status" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Enforce aggregate coverage
        run: bun scripts/coverage-check.ts coverage.txt
      - run: bun scripts/package-smoke.ts

  authenticated-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run authenticated smoke against minimum and latest OpenCode
        shell: bash
        run: |
          minimum=$(node -p "require('./package.json').engines.opencode.match(/>=([0-9.]+)/)[1]")
          for target in "$minimum" latest; do
            bun add --global "opencode-ai@$target"
            opencode --version
            OPENCODE_SMOKE_MODEL="${OPENCODE_SMOKE_MODEL}" bun scripts/smoke-opencode.ts
          done
        env:
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
          OPENCODE_SMOKE_MODEL: ${{ vars.OPENCODE_SMOKE_MODEL || 'Ark/deepseek-v4-flash' }}
