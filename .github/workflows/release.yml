name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag and package version
        if: github.event_name == 'push'
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: bun run typecheck
      - run: bun test
      - name: Enforce aggregate coverage
        run: bun scripts/coverage-check.ts
      - name: Create candidate tarball
        run: bun pm pack --destination .
      - name: Verify candidate package
        run: |
          version=$(node -p "require('./package.json').version")
          GOAT_PACKAGE_SMOKE_TARBALL="$PWD/opencode-goat-$version.tgz" bun scripts/package-smoke.ts
      - name: Run authenticated smoke against minimum and latest OpenCode
        env:
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
          OPENCODE_SMOKE_MODEL: ${{ vars.OPENCODE_SMOKE_MODEL || 'opencode/deepseek-v4-flash-free' }}
        run: |
          version=$(node -p "require('./package.json').version")
          minimum=$(node -p "require('./package.json').engines.opencode.match(/>=([0-9.]+)/)[1]")
          for target in "$minimum" latest; do
            bun add --global "opencode-ai@$target"
            opencode --version
            GOAT_PACKAGE_SMOKE_TARBALL="$PWD/opencode-goat-$version.tgz" bun scripts/smoke-opencode.ts
          done
      - name: Publish to npm
        if: github.event_name == 'push'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          npm install --global npm@11.6.2
          npm --version
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then tag=alpha; else tag=latest; fi
          set +e
          output=$(npm publish "opencode-goat-$version.tgz" --access public --tag "$tag" 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [[ "$status" -ne 0 ]]; then
            diagnostic=$(printf '%s' "$output" | tail -c 4000 | tr '\n' ' ' | sed 's/%/%25/g')
            printf '::error title=npm publish::%s\n' "$diagnostic"
            exit "$status"
          fi
      - name: Verify published package
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5; do
            if npm view "opencode-goat@$version" version dist-tags --json; then exit 0; fi
            sleep 10
          done
          echo "published package was not visible on npm after retries" >&2
          exit 1
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes; else gh release create "$GITHUB_REF_NAME" --generate-notes; fi
