name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag and package version
        if: github.event_name == 'push'
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: bun run typecheck
      - run: bun run coverage:check
      - name: Create candidate tarball
        run: bun pm pack --destination .
      - name: Verify candidate package
        run: |
          version=$(node -p "require('./package.json').version")
          GOAT_PACKAGE_SMOKE_TARBALL="$PWD/opencode-goat-$version.tgz" bun scripts/package-smoke.ts
      - name: Run authenticated smoke against minimum and latest OpenCode
        env:
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
          OPENCODE_SMOKE_MODEL: ${{ vars.OPENCODE_SMOKE_MODEL || 'Ark/deepseek-v4-flash' }}
        run: |
          version=$(node -p "require('./package.json').version")
          minimum=$(node -p "require('./package.json').engines.opencode.match(/>=([0-9.]+)/)[1]")
          for target in "$minimum" latest; do
            bun add --global "opencode-ai@$target"
            opencode --version
            GOAT_PACKAGE_SMOKE_TARBALL="$PWD/opencode-goat-$version.tgz" bun scripts/smoke-opencode.ts
          done
      - name: Publish to npm
        if: github.event_name == 'push'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then tag=alpha; else tag=latest; fi
          npm publish "opencode-goat-$version.tgz" --access public --tag "$tag"
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes; else gh release create "$GITHUB_REF_NAME" --generate-notes; fi
