<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Goat 证据闭环工作流</title>
  <desc id="desc">意图先形成 Contract，经用户审批后在受限 workspace 执行，再由独立 Verifier 验证；失败会回到执行阶段修正。</desc>
  <defs>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b7ef4a"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#67d6ce"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#ffb45b"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6a8587" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1400" height="620" rx="28" fill="#172329"/><rect width="1400" height="620" rx="28" fill="url(#grid)"/>
  <text x="70" y="70" fill="#b7ef4a" font-family="Microsoft YaHei,Noto Sans SC,Arial,sans-serif" font-size="16" letter-spacing="4">证据闭环</text>
  <text x="70" y="108" fill="#f4efe4" font-family="Microsoft YaHei,Noto Sans SC,Arial,sans-serif" font-size="30" font-weight="700">授权向前，证据回流。</text>
  <text x="70" y="137" fill="#91aaa5" font-family="Microsoft YaHei,Noto Sans SC,Arial,sans-serif" font-size="16">用户掌握闸门；每一项 MUST 标准都必须带着证据返回。</text>
  <path d="M365 260C450 260 475 180 550 180" fill="none" stroke="#b7ef4a" stroke-width="4" marker-end="url(#arrow-lime)"/><path d="M850 180C930 180 960 260 1035 260" fill="none" stroke="#b7ef4a" stroke-width="4" marker-end="url(#arrow-lime)"/><path d="M1165 375C1165 475 1020 500 850 500" fill="none" stroke="#67d6ce" stroke-width="4" marker-end="url(#arrow-cyan)"/><path d="M850 500C980 500 980 410 1035 360" fill="none" stroke="#ffb45b" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow-orange)"/>
  <text x="900" y="218" fill="#b7ef4a" font-family="Consolas,monospace" font-size="12" letter-spacing="2">已批准的执行权</text><text x="950" y="476" fill="#67d6ce" font-family="Consolas,monospace" font-size="12" letter-spacing="2">证据回流</text><text x="875" y="545" fill="#ffcf91" font-family="Consolas,monospace" font-size="12" letter-spacing="2">失败 / 修订 / 重试</text>
  <g font-family="Microsoft YaHei,Noto Sans SC,Arial,sans-serif">
    <g transform="translate(70 205)"><rect width="295" height="170" rx="20" fill="#203237" stroke="#45605f" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#172329" stroke="#67d6ce" stroke-width="3"/><text x="42" y="48" text-anchor="middle" fill="#67d6ce" font-family="Consolas,monospace" font-size="15">01</text><text x="78" y="39" fill="#f4efe4" font-size="24" font-weight="700">整理意图</text><text x="28" y="93" fill="#c9d7d1" font-size="15">Formulator 保持只读。</text><text x="28" y="119" fill="#91aaa5" font-size="14">结果、范围、约束、假设</text><text x="28" y="141" fill="#91aaa5" font-size="14">和 MUST 标准变得可观察。</text></g>
    <g transform="translate(550 95)"><rect width="300" height="170" rx="20" fill="#203237" stroke="#ffb45b" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#172329" stroke="#ffb45b" stroke-width="3"/><text x="42" y="48" text-anchor="middle" fill="#ffb45b" font-family="Consolas,monospace" font-size="15">02</text><text x="78" y="39" fill="#f4efe4" font-size="24" font-weight="700">打开审批闸门</text><text x="28" y="93" fill="#c9d7d1" font-size="15">用户批准精确 Contract。</text><text x="28" y="119" fill="#ffcf91" font-size="14">此前不写入项目 workspace。</text><text x="28" y="141" fill="#91aaa5" font-size="14">原生权限始终是最终策略。</text></g>
    <g transform="translate(1035 205)"><rect width="295" height="170" rx="20" fill="#203237" stroke="#b7ef4a" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#172329" stroke="#b7ef4a" stroke-width="3"/><text x="42" y="48" text-anchor="middle" fill="#b7ef4a" font-family="Consolas,monospace" font-size="15">03</text><text x="78" y="39" fill="#f4efe4" font-size="24" font-weight="700">执行并留证</text><text x="28" y="93" fill="#c9d7d1" font-size="15">Executor 在批准的 workspace</text><text x="28" y="119" fill="#91aaa5" font-size="14">中工作，并为每项 MUST</text><text x="28" y="141" fill="#91aaa5" font-size="14">标准记录证据。</text></g>
    <g transform="translate(550 415)"><rect width="300" height="155" rx="20" fill="#203237" stroke="#67d6ce" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#172329" stroke="#67d6ce" stroke-width="3"/><text x="42" y="48" text-anchor="middle" fill="#67d6ce" font-family="Consolas,monospace" font-size="15">04</text><text x="78" y="39" fill="#f4efe4" font-size="24" font-weight="700">独立验证</text><text x="28" y="91" fill="#c9d7d1" font-size="15">Verifier 检查 diff 和证据。</text><text x="28" y="117" fill="#67d6ce" font-size="14">PASS 完成；FAIL 回到 03。</text></g>
  </g>
  <g transform="translate(1050 510)"><rect width="280" height="54" rx="15" fill="#b7ef4a"/><text x="140" y="34" text-anchor="middle" fill="#172329" font-family="Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2">完成 = 证据充分</text></g>
</svg>
