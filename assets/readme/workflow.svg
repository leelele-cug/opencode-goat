<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
  <title id="title">Goat Goal workflow</title>
  <desc id="desc">A Goal becomes a plan and waits for approval. Goat then creates an isolated Git worktree where execution, verification, and up to ten correction rounds occur. Passing verification completes the Goal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#71807D"/></marker>
    <marker id="arrow-pass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#B7EF4A"/></marker>
  </defs>
  <rect width="1400" height="340" fill="#172329"/>
  <g id="header">
    <g transform="translate(58 46) scale(.75)">
      <path d="M48 20c-4-5-10-8-17-8-11 0-19 8-19 20s8 20 19 20c7 0 13-3 17-8V32H35" fill="none" stroke="#F4EFE4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 34l7 7 16-18" fill="none" stroke="#B7EF4A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="118" y="75" fill="#F4EFE4" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Goal workflow</text>
    <text x="118" y="104" fill="#98A6A3" font-family="Arial,Helvetica,sans-serif" font-size="15">Approval comes before worktree changes. Verification decides completion.</text>
  </g>
  <g id="worktree-context">
    <rect x="725" y="139" width="430" height="166" rx="24" fill="#1C2A30" stroke="#43514F" stroke-width="1.5"/>
    <text x="940" y="129" fill="#98A6A3" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">Isolated Git worktree - created after approval</text>
  </g>
  <g id="main-flow" fill="none" stroke="#71807D" stroke-width="3" marker-end="url(#arrow)">
    <path d="M111 218H309"/>
    <path d="M351 218H549"/>
    <path d="M591 218H789"/>
    <path d="M831 218 C875 188 985 188 1029 218"/>
  </g>
  <path id="pass-flow" d="M1071 218H1269" fill="none" stroke="#B7EF4A" stroke-width="3" marker-end="url(#arrow-pass)"/>
  <path id="feedback-loop" d="M1029 218 C985 248 875 248 831 218" fill="none" stroke="#71807D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".75" marker-end="url(#arrow)"/>
  <g id="workflow-nodes">
    <circle cx="90" cy="218" r="20" fill="#172329" stroke="#71807D" stroke-width="3"/>
    <circle cx="330" cy="218" r="20" fill="#172329" stroke="#71807D" stroke-width="3"/>
    <circle cx="570" cy="218" r="20" fill="#172329" stroke="#71807D" stroke-width="3"/>
    <circle cx="810" cy="218" r="20" fill="#172329" stroke="#71807D" stroke-width="3"/>
    <circle cx="1050" cy="218" r="20" fill="#172329" stroke="#71807D" stroke-width="3"/>
    <circle cx="1290" cy="218" r="20" fill="#B7EF4A"/>
    <path d="M1281 218l6 6 12-14" fill="none" stroke="#172329" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="workflow-labels" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <g>
      <text x="90" y="169" fill="#F4EFE4" font-size="22" font-weight="700">Goal</text>
      <text x="90" y="190" fill="#98A6A3" font-size="14">desired outcome</text>
    </g>
    <g>
      <text x="330" y="169" fill="#F4EFE4" font-size="22" font-weight="700">Plan</text>
      <text x="330" y="190" fill="#98A6A3" font-size="14">scope and checks</text>
    </g>
    <g>
      <text x="570" y="169" fill="#F4EFE4" font-size="22" font-weight="700">Approve</text>
      <text x="570" y="190" fill="#98A6A3" font-size="14">user gate</text>
    </g>
    <g>
      <text x="810" y="169" fill="#F4EFE4" font-size="22" font-weight="700">Execute</text>
      <text x="810" y="190" fill="#98A6A3" font-size="14">make changes</text>
    </g>
    <g>
      <text x="1050" y="169" fill="#F4EFE4" font-size="22" font-weight="700">Verify</text>
      <text x="1050" y="190" fill="#98A6A3" font-size="14">criteria and evidence</text>
    </g>
    <g>
      <text x="1290" y="169" fill="#F4EFE4" font-size="22" font-weight="700">Done</text>
      <text x="1290" y="190" fill="#98A6A3" font-size="14">verification passed</text>
    </g>
    <text x="1170" y="249" fill="#B7EF4A" font-size="13">Pass</text>
    <text x="930" y="275" fill="#98A6A3" font-size="13">Fail: correct and verify again (up to 10 rounds)</text>
  </g>
</svg>
