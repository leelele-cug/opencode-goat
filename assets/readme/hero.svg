<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Goat evidence loop for OpenCode</title>
  <desc id="desc">Authority moves from intent through approval to execution. Evidence returns through independent verification before completion.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6a8587" stroke-opacity=".14"/></pattern>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111c20"/><stop offset="1" stop-color="#20373a"/></linearGradient>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b7ef4a"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#67d6ce"/></marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <path d="M0 470H1600" stroke="#67d6ce" stroke-opacity=".18"/>
  <g transform="translate(84 76)">
    <rect width="72" height="72" rx="18" fill="#f4efe4"/>
    <path d="M54 22c-4-5-10-8-17-8-11 0-19 8-19 20s8 20 19 20c7 0 13-3 17-8V34H41" fill="none" stroke="#172329" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 36l7 7 16-18" fill="none" stroke="#7da92c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="84" y="184" fill="#b7ef4a" font-family="Consolas,monospace" font-size="17" letter-spacing="4">EVIDENCE LOOP / OPENCODE WORKFLOW</text>
  <text x="80" y="272" fill="#f4efe4" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700">Authority goes out.</text>
  <text x="80" y="344" fill="#f4efe4" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700">Evidence comes back.</text>
  <text x="84" y="392" fill="#c9d7d1" font-family="Arial,Helvetica,sans-serif" font-size="23">Lock the exact Contract before execution.</text>
  <text x="84" y="423" fill="#c9d7d1" font-family="Arial,Helvetica,sans-serif" font-size="23">Return independent proof before completion.</text>
  <g transform="translate(830 64)">
    <rect x="0" y="0" width="692" height="416" rx="28" fill="#172329" fill-opacity=".72" stroke="#45605f" stroke-width="2"/>
    <text x="34" y="40" fill="#91aaa5" font-family="Consolas,monospace" font-size="13" letter-spacing="3">ONE CONTROLLED LOOP</text>
    <path d="M76 128H610" fill="none" stroke="#b7ef4a" stroke-width="3" marker-end="url(#arrow-lime)"/>
    <path d="M610 300H76" fill="none" stroke="#67d6ce" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <path d="M610 128C664 128 664 300 610 300" fill="none" stroke="#67d6ce" stroke-width="3" stroke-dasharray="7 9"/>
    <path d="M76 300C22 300 22 128 76 128" fill="none" stroke="#ffb45b" stroke-width="2" stroke-dasharray="5 10" opacity=".75"/>
    <g fill="#172329" stroke="#f4efe4" stroke-width="2">
      <circle cx="76" cy="128" r="20"/><circle cx="254" cy="128" r="20"/><circle cx="432" cy="128" r="20"/><circle cx="610" cy="128" r="20"/>
      <circle cx="610" cy="300" r="20"/><circle cx="432" cy="300" r="20"/><circle cx="254" cy="300" r="20"/><circle cx="76" cy="300" r="20"/>
    </g>
    <g fill="#b7ef4a"><circle cx="76" cy="128" r="7"/><circle cx="254" cy="128" r="7"/><circle cx="432" cy="128" r="7"/><circle cx="610" cy="128" r="7"/></g>
    <g fill="#67d6ce"><circle cx="610" cy="300" r="7"/><circle cx="432" cy="300" r="7"/><circle cx="254" cy="300" r="7"/><circle cx="76" cy="300" r="7"/></g>
    <g fill="#f4efe4" font-family="Consolas,monospace" font-size="13" text-anchor="middle"><text x="76" y="93">INTENT</text><text x="254" y="93">CONTRACT</text><text x="432" y="93">APPROVAL</text><text x="610" y="93">EXECUTE</text><text x="610" y="345">DIFF</text><text x="432" y="345">VERIFY</text><text x="254" y="345">PASS / FIX</text><text x="76" y="345">EVIDENCE</text></g>
    <rect x="219" y="175" width="254" height="75" rx="16" fill="#22383b" stroke="#45605f"/>
    <text x="346" y="207" text-anchor="middle" fill="#b7ef4a" font-family="Consolas,monospace" font-size="16" letter-spacing="2">DURABLE STATE</text>
    <text x="346" y="231" text-anchor="middle" fill="#91aaa5" font-family="Arial,Helvetica,sans-serif" font-size="14">approval / lease / evidence</text>
    <rect x="382" y="105" width="100" height="46" rx="10" fill="#ffb45b" fill-opacity=".15" stroke="#ffb45b"/>
    <text x="432" y="133" text-anchor="middle" fill="#ffcf91" font-family="Consolas,monospace" font-size="11">HUMAN GATE</text>
    <text x="346" y="395" text-anchor="middle" fill="#67d6ce" font-family="Consolas,monospace" font-size="12" letter-spacing="2">INDEPENDENT VERIFICATION CLOSES THE LOOP</text>
  </g>
  <g fill="#91aaa5" font-family="Consolas,monospace" font-size="13" letter-spacing="2"><text x="84" y="508">CONTRACT BEFORE WRITE</text><text x="420" y="508">EVIDENCE BEFORE DONE</text><text x="748" y="508">NATIVE PERMISSIONS STAY FINAL</text></g>
</svg>
