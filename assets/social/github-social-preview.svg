<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Goat evidence loop for OpenCode</title>
  <desc id="desc">Goat sends authority through a human approval gate and brings evidence back through independent verification.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6a8587" stroke-opacity=".14"/></pattern>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b7ef4a"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#67d6ce"/></marker>
  </defs>
  <rect width="1280" height="640" fill="#172329"/><rect width="1280" height="640" fill="url(#grid)"/>
  <g transform="translate(78 82) scale(2.1)"><path d="M48 20c-4-5-10-8-17-8-11 0-19 8-19 20s8 20 19 20c7 0 13-3 17-8V32H35" fill="none" stroke="#f4efe4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 34l7 7 16-18" fill="none" stroke="#b7ef4a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="32" r="3" fill="#67d6ce"/><circle cx="52" cy="24" r="3" fill="#ffb45b"/></g>
  <text x="78" y="250" fill="#b7ef4a" font-family="Consolas,monospace" font-size="17" letter-spacing="4">EVIDENCE LOOP / OPENCODE</text>
  <text x="72" y="338" fill="#f4efe4" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="700" letter-spacing="7">GOAT</text>
  <text x="78" y="394" fill="#f4efe4" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Authority goes out.</text>
  <text x="78" y="434" fill="#f4efe4" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Evidence comes back.</text>
  <text x="80" y="478" fill="#91aaa5" font-family="Arial,Helvetica,sans-serif" font-size="17">Contract before write. Proof before done.</text>
  <g transform="translate(735 110)">
    <rect width="470" height="380" rx="26" fill="#203237" stroke="#45605f" stroke-width="2"/>
    <text x="235" y="42" text-anchor="middle" fill="#91aaa5" font-family="Consolas,monospace" font-size="13" letter-spacing="3">THE CONTROLLED LOOP</text>
    <path d="M82 125H388" fill="none" stroke="#b7ef4a" stroke-width="4" marker-end="url(#arrow-lime)"/><path d="M388 260H82" fill="none" stroke="#67d6ce" stroke-width="4" marker-end="url(#arrow-cyan)"/>
    <path d="M388 125C440 125 440 260 388 260" fill="none" stroke="#67d6ce" stroke-width="3" stroke-dasharray="7 9"/><path d="M82 260C30 260 30 125 82 125" fill="none" stroke="#ffb45b" stroke-width="2" stroke-dasharray="5 9"/>
    <g fill="#172329" stroke="#f4efe4" stroke-width="2"><circle cx="82" cy="125" r="20"/><circle cx="184" cy="125" r="20"/><circle cx="286" cy="125" r="20"/><circle cx="388" cy="125" r="20"/><circle cx="388" cy="260" r="20"/><circle cx="286" cy="260" r="20"/><circle cx="184" cy="260" r="20"/><circle cx="82" cy="260" r="20"/></g>
    <g fill="#b7ef4a"><circle cx="82" cy="125" r="7"/><circle cx="184" cy="125" r="7"/><circle cx="286" cy="125" r="7"/><circle cx="388" cy="125" r="7"/></g><g fill="#67d6ce"><circle cx="388" cy="260" r="7"/><circle cx="286" cy="260" r="7"/><circle cx="184" cy="260" r="7"/><circle cx="82" cy="260" r="7"/></g>
    <g fill="#f4efe4" font-family="Consolas,monospace" font-size="11" text-anchor="middle"><text x="82" y="91">INTENT</text><text x="184" y="91">CONTRACT</text><text x="286" y="91">APPROVAL</text><text x="388" y="91">EXECUTE</text><text x="388" y="300">DIFF</text><text x="286" y="300">VERIFY</text><text x="184" y="300">PASS / FIX</text><text x="82" y="300">EVIDENCE</text></g>
    <rect x="135" y="164" width="200" height="70" rx="15" fill="#172329" stroke="#ffb45b"/><text x="235" y="193" text-anchor="middle" fill="#ffcf91" font-family="Consolas,monospace" font-size="13" letter-spacing="2">HUMAN GATE</text><text x="235" y="216" text-anchor="middle" fill="#91aaa5" font-family="Arial,Helvetica,sans-serif" font-size="13">DURABLE STATE</text>
  </g>
  <path d="M78 548H1200" stroke="#45605f" stroke-width="2"/><circle cx="78" cy="548" r="6" fill="#b7ef4a"/><circle cx="1200" cy="548" r="6" fill="#67d6ce"/>
  <text x="92" y="583" fill="#91aaa5" font-family="Consolas,monospace" font-size="13" letter-spacing="2">GOAL OPERATIONALIZATION / ALIGNMENT / TESTING</text>
</svg>
